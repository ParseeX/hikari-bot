name: Trigger Server Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        if: contains(github.event.head_commit.message, '[deploy-ygo-toolbox]')
      - uses: astral-sh/setup-uv@v6
        if: contains(github.event.head_commit.message, '[deploy-ygo-toolbox]')
      - name: Test MyCard changes
        if: contains(github.event.head_commit.message, '[deploy-ygo-toolbox]')
        timeout-minutes: 6
        run: |
          uv run --frozen --python 3.12 python -m pytest -q tests/test_card_catalog_search_many.py tests/test_mycard_admin.py tests/test_mycard_front.py tests/test_mycard_decks.py tests/test_deck_web.py tests/test_output_editor.py
      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            bash "$HOME/hikari-bot/update.sh"
            if [ "${{ contains(github.event.head_commit.message, '[sync-mycard-qq]') }}" = true ]; then
              cd "$HOME/hikari-bot"
              export XDG_RUNTIME_DIR="/run/user/$(id -u)"
              PYTHONPATH=. .venv/bin/python deploy/sync_mycard_release.py 35ac68d87e328eaf65463c16a72d0be751fcb0b5
            fi

  deploy-frontend:
    needs: deploy
    # Explicit deploy-only marker avoids rebuilding the entire site on every Bot commit.
    if: contains(github.event.head_commit.message, '[deploy-ygo-toolbox]')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ygo-toolbox on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd "$HOME/ygo-toolbox"
            git fetch origin main
            git merge-base --is-ancestor HEAD FETCH_HEAD
            git status --short --branch
            git diff --quiet HEAD -- deploy.sh
            git merge --ff-only FETCH_HEAD
            bash deploy.sh mycard
            probe=$(mktemp)
            trap 'rm -f "$probe"' EXIT
            curl -fsSL --retry 3 "https://ygo.xyk.one/admin?rev=$(git rev-parse --short HEAD)" -o "$probe"
            grep -q 'id="mc-hide-home-art"' "$probe"
            curl -fsS --retry 4 --retry-all-errors 'https://ygo.xyk.one/mc/api/leaderboard?page=1' | python3 -c 'import json,sys; assert json.load(sys.stdin)["players"]'
            curl -fsS --retry 3 'https://ygo.xyk.one/mc/api/deck-stats' | python3 -c 'import json,sys; assert json.load(sys.stdin)["series"]'
            python3 server/verify-mycard-release.py
            systemctl is-active bot.service ygo-content.service
