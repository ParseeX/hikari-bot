name: Temporary server working-tree comparison
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare server worktree blobs to GitHub main (no file contents)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: false
          script: |
            cd "$HOME/hikari-bot"
            git fetch origin main >/dev/null 2>&1
            python3 - <<'PY'
            import subprocess
            def git(*args):
                result = subprocess.run(['git', *args], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                return result.stdout.decode('utf-8', errors='replace').strip()
            print('SERVER_HEAD=' + git('rev-parse','--short','HEAD'))
            print('REMOTE_HEAD=' + git('rev-parse','--short','origin/main'))
            paths = set(git('diff','--name-only','HEAD').splitlines())
            paths.update(git('ls-files','--others','--exclude-standard').splitlines())
            matched = different = 0
            for path in sorted(paths):
                if not path:
                    continue
                remote = git('rev-parse','-q','--verify','origin/main:' + path)
                local = git('hash-object','--',path)
                if remote and remote == local:
                    matched += 1
                    print('MATCH ' + path, flush=True)
                else:
                    different += 1
                    previous = None
                    for commit in git('log','--format=%H','origin/main','--',path).splitlines():
                        if git('rev-parse','-q','--verify',commit + ':' + path) == local:
                            previous = commit[:10]
                            break
                    if previous:
                        print('HISTORICAL_MATCH ' + previous + ' ' + path, flush=True)
                    else:
                        print('UNIQUE_WORKTREE ' + path, flush=True)
            print(f'SUMMARY matched={matched} different={different}', flush=True)
            import ast, pathlib, difflib
            def signatures(code):
                try:
                    tree = ast.parse(code)
                except SyntaxError:
                    return None
                items = {}
                def visit(nodes, prefix=''):
                    for node in nodes:
                        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                            name = prefix + node.name
                            items[name] = ast.dump(node, include_attributes=False)
                            if isinstance(node, ast.ClassDef):
                                visit(node.body, name + '.')
                visit(tree.body)
                return items
            for path in sorted(paths):
                if not path or not path.endswith('.py'):
                    continue
                remote_hash = git('rev-parse','-q','--verify','origin/main:' + path)
                local_hash = git('hash-object','--',path)
                if remote_hash and local_hash == remote_hash:
                    continue
                original = subprocess.run(['git','show','origin/main:' + path], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL).stdout.decode('utf-8',errors='replace')
                try:
                    current = pathlib.Path(path).read_text('utf-8')
                except Exception:
                    continue
                a = signatures(current)
                b = signatures(original)
                if a is None or b is None:
                    print('AST_PARSE_FAILED ' + path, flush=True)
                    continue
                added = sorted(set(a) - set(b))
                removed = sorted(set(b) - set(a))
                altered = sorted(k for k in (set(a) & set(b)) if a[k] != b[k])
                delta = difflib.SequenceMatcher(None, original.splitlines(), current.splitlines(), autojunk=False)
                changes = [(tag, i2-i1, j2-j1) for tag,i1,i2,j1,j2 in delta.get_opcodes() if tag!='equal']
                print('FUNCTION_CHANGES ' + path, flush=True)
                print('  only_local=' + ','.join(added[:30]) + ' only_remote=' + ','.join(removed[:30]), flush=True)
                print('  modified=' + ','.join(altered[:35]), flush=True)
                print('  line_ops=' + str(changes[:20]), flush=True)
            PY
