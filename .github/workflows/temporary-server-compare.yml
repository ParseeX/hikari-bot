name: Temporary safe server sync
on:
  push:
    branches: [main]
jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every local file has no unpublished functional changes, back up, and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: false
          script: |
            set -eu
            cd "$HOME/hikari-bot"
            git fetch origin main >/dev/null 2>&1
            python3 - <<'PY'
            import pathlib
            import subprocess
            import sys
            def run(*args):
                return subprocess.run(['git', *args], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
            def git(*args):
                return run(*args).stdout.decode('utf-8',errors='replace').strip()
            def normalize(data):
                return data.replace(b'\r\n',b'\n').replace(b'\r',b'\n').rstrip(b'\n')
            paths = set(git('diff','--name-only','HEAD').splitlines())
            paths.update(git('ls-files','--others','--exclude-standard').splitlines())
            unsafe = []
            for path in sorted(paths):
                if not path:
                    continue
                remote_result = run('show', 'origin/main:' + path)
                local_path = pathlib.Path(path)
                if remote_result.returncode or not local_path.is_file():
                    unsafe.append(path)
                    print('UNSAFE missing from upstream or local: ' + path, flush=True)
                    continue
                remote = remote_result.stdout
                local = local_path.read_bytes()
                if local == remote:
                    kind = 'EXACT'
                elif normalize(local) == normalize(remote):
                    kind = 'NEWLINES_ONLY'
                else:
                    local_hash = git('hash-object','--',path)
                    history = git('log','--format=%H','origin/main','--',path).splitlines()
                    match = next((commit for commit in history if git('rev-parse','-q','--verify',commit + ':' + path) == local_hash),None)
                    if match:
                        kind = 'PREVIOUSLY_COMMITTED:' + match[:10]
                    else:
                        kind = 'UNPUBLISHED_CHANGE'
                        unsafe.append(path)
                print(kind + ' ' + path, flush=True)
            if unsafe:
                print('ABORT: unpublished or unverified differences: ' + ', '.join(unsafe), flush=True)
                sys.exit(10)
            print('VERIFIED_SAFE: ' + str(len(paths)) + ' paths. Existing files are published or only have newline differences.', flush=True)
            PY
            git stash push -u -m "safety backup before sync of already-published worktree"
            git merge --ff-only origin/main
            bash "$HOME/hikari-bot/update.sh"
            echo "SYNCED_HEAD=$(git rev-parse --short HEAD)"
            git stash list -1
