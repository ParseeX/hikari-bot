name: Temporary MyCard live query diagnosis
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce MyCard queries with deployed code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: false
          script: |
            cd "$HOME/hikari-bot"
            echo "CODE_REVISION=$(git rev-parse --short HEAD)"
            systemctl is-active bot.service || true
            uv run python - <<'PY'
            import asyncio
            import traceback
            from hikari_bot.services import mycard
            from hikari_bot.services.mycard_history import month_trend, is_zero_delta_match
            async def check():
                name='一群好事之徒'
                try:
                    records=await mycard.mycard_get_records(name,11,2026)
                    print('ALL_RECORDS',type(records).__name__,len(records) if isinstance(records,list) else None,flush=True)
                    valid=[x for x in records if not is_zero_delta_match(x,name)]
                    print('VALID_RECORDS',len(valid),flush=True)
                    prev=await mycard.fetch_previous_month_score(name,2026,11)
                    print('PREVIOUS_SCORE',repr(prev),flush=True)
                    points=month_trend(valid,name,2026,11,prev)
                    print('TREND',len(points),points[0]['score'],points[-1]['score'],flush=True)
                    print('RANK',await mycard.mycard_get_player_rank(name),flush=True)
                    for rec in valid[:3]:
                        print('RECORD_FIELDS',sorted(rec.keys()),flush=True)
                except Exception as e:
                    print('EXCEPTION',type(e).__name__,str(e),flush=True)
                    traceback.print_exc(limit=6)
            asyncio.run(check())
            PY
